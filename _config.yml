theme: jekyll-theme-chirpy

lang: ko-KR
timezone: Asia/Seoul

# ─── 블로그 기본 정보 ────────────────────────────────
title: log.dev
tagline: 배운 것을 정리하고, 만든 것을 공유합니다
description: >-
  C, C++, C#, 컴퓨터과학, 알고리즘, 게임기획, 유니티를 공부하며
  직접 이해한 내용을 기록하는 블로그입니다.

url: "https://YOUR_GITHUB_USERNAME.github.io"   # ← 본인 username으로 변경

github:
  username: YOUR_GITHUB_USERNAME                 # ← 본인 username으로 변경

# twitter:
#   username: your_twitter

social:
  name: Your Name                                # ← 본인 이름으로 변경
  email: your@email.com                          # ← 본인 이메일로 변경
  links:
    - https://github.com/YOUR_GITHUB_USERNAME

# ─── 테마 설정 ──────────────────────────────────────
theme_mode: dark    # dark를 기본값으로 고정

avatar: /assets/img/avatar.png   # 프로필 이미지 경로 (없으면 삭제)

toc: true           # 글 목차 자동 생성

# ─── 댓글 (Giscus) ───────────────────────────────────
comments:
  active: giscus
  giscus:
    repo: YOUR_GITHUB_USERNAME/YOUR_GITHUB_USERNAME.github.io   # ← 변경
    repo_id: ""          # giscus.app에서 발급받은 값 붙여넣기
    category: Comments
    category_id: ""      # giscus.app에서 발급받은 값 붙여넣기
    mapping: pathname
    input_position: bottom
    lang: ko
    reactions_enabled: "1"

# ─── 페이지네이션 ────────────────────────────────────
paginate: 10

# ─── 카테고리 / 태그 페이지 ──────────────────────────
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true          # 모든 글에 댓글 활성화
      toc: true
      math: true              # 수식 지원 (알고리즘 글에 필요)
      mermaid: false

  - scope:
      path: "_tabs"
      type: tabs
    values:
      layout: page
      permalink: /:title/

# ─── 플러그인 ─────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ─── 빌드 제외 파일 ───────────────────────────────────
exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
